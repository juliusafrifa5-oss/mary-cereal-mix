<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b45">
<title>MARY CEREAL MIX | Online Ordering</title>
<style>
:root{--green:#176b45;--deep:#104d33;--gold:#f2b544;--cream:#fffaf0;--ink:#20312a;--muted:#68766f;--line:#e4eae5;--red:#b42318;--blue:#175cd3}
*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:#fff;font-weight:650}button.secondary{background:#e8f1eb;color:var(--deep)}button.danger{background:#b42318}button.gold{background:var(--gold);color:#342300}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--green)}.wrap{max-width:1200px;margin:auto;padding:18px}.top{background:linear-gradient(115deg,var(--deep),#248052);color:white;padding:18px 0}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:850;letter-spacing:.3px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.85}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:#ffffff20;border:1px solid #ffffff35}.nav button.active{background:#fff;color:var(--deep)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 5px 20px #173b2510}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1,h2,h3{line-height:1.2;margin:0 0 12px}h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}p{margin:6px 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ccd7cf;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:78px;resize:vertical}.hidden{display:none!important}.card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.product img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#edf2ed}.price{font-size:19px;font-weight:800;color:var(--green)}.badge{display:inline-block;border-radius:30px;padding:3px 9px;font-size:11px;font-weight:800;background:#e8f1eb;color:var(--deep)}.badge.new{background:#fff0cb;color:#795000;animation:pulse 1.8s infinite}@keyframes pulse{50%{filter:brightness(.88)}}.promo{border-radius:16px;overflow:hidden;min-height:175px;background:linear-gradient(110deg,#104d33,#288557);color:white;display:grid;grid-template-columns:1.2fr 1fr}.promo img{width:100%;height:100%;max-height:230px;object-fit:cover}.promoText{padding:22px}.promoText h2{font-size:25px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f4f8f4;font-size:12px;text-transform:uppercase}.stat{font-size:25px;font-weight:850;color:var(--green)}.notice{padding:12px;border-radius:10px;background:#fff5dc;color:#684800;margin:10px 0}.success{background:#e9f8ef;color:#155c36}.error{background:#fff0ef;color:#9a271f}.status{font-weight:750}.timeline{border-left:3px solid #c8dfcf;padding-left:15px;margin:12px 0}.step{margin:0 0 14px;position:relative}.step:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);position:absolute;left:-21px;top:5px}.footer{padding:22px 0;color:var(--muted);text-align:center}.support{position:fixed;right:16px;bottom:16px;z-index:20;border-radius:50px;box-shadow:0 5px 20px #0003}.pill{display:inline-block;padding:5px 10px;background:#eef4ef;border-radius:30px;margin:2px}.actions{display:flex;gap:7px;flex-wrap:wrap}.hr{height:1px;background:var(--line);margin:14px 0}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:650px){.wrap{padding:12px}.promo{grid-template-columns:1fr}.promo img{height:140px}.top .wrap{align-items:flex-start}.brand{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">MARY CEREAL MIX<small>Fresh nourishment • Easy ordering • Reliable delivery</small></div><div class="nav" id="nav"></div></div></header>
<main class="wrap">
<section id="authView" class="panel">
<h1>Welcome to Mary Cereal Mix</h1><p class="muted">Sign in to order, pay and track your deliveries.</p>
<div class="grid">
<div><h2>Sign in</h2><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div><button onclick="login()">Sign in</button> <button class="secondary" onclick="resetPassword()">Reset password</button></div>
<div><h2>Create customer account</h2><div class="field"><label>Full name</label><input id="regName"></div><div class="field"><label>Phone number</label><input id="regPhone" type="tel"></div><div class="field"><label>Email</label><input id="regEmail" type="email"></div><div class="field"><label>Password (minimum 6 characters)</label><input id="regPass" type="password"></div><div class="field"><label>Account type</label><select id="regType"><option value="retail">Retail customer</option><option value="wholesale">Wholesale customer (approval required)</option></select></div><button onclick="register()">Create account</button></div>
</div><div id="authMsg" class="notice hidden"></div>
</section>
<section id="appView" class="hidden">
<div id="promoArea"></div><div id="page"></div>
</section>
</main>
<button class="support" onclick="window.open('https://wa.me/233242449323?text=Hello%20Mary%20Cereal%20Mix','_blank')">WhatsApp Support</button>
<footer class="footer">Mary Cereal Mix · Support: <a href="tel:0242449323">0242449323</a> · <a href="tel:0545628054">0545628054</a></footer>
<div id="toast" class="hidden"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,getDocs,query,where,orderBy,limit,onSnapshot,runTransaction,serverTimestamp,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyAH5WgA9zPVtOm1S8xYp0JhRXXprtyOxNA",authDomain:"mary-cereal-mix.firebaseapp.com",projectId:"mary-cereal-mix",storageBucket:"mary-cereal-mix.firebasestorage.app",messagingSenderId:"108550919620",appId:"1:108550919620:web:23ccc6c818165870870091"};
const ADMIN_UID="BzTy6OPheYNFPfhEBgRZavmm0cu2",MOMO="0545628054",MOMO_NAME="MARY OPOKU WARE";
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
let user=null,profile=null,isAdmin=false,products=[],cart=[],orders=[],promos=[],articles=[],regions=[],districts=[],towns=[],activeTab="shop",unsubs=[];
const $=id=>document.getElementById(id), money=n=>"GH₵"+Number(n||0).toFixed(2), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){const t=$("toast");t.textContent=s;t.className="notice";t.style.position="fixed";t.style.bottom="75px";t.style.left="15px";t.style.zIndex=50;setTimeout(()=>t.className="hidden",3500)}
function msg(s,ok=false){$("authMsg").textContent=s;$("authMsg").className="notice "+(ok?"success":"error")}
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPass").value)}catch(e){msg(e.message)}};
window.register=async()=>{try{const name=$("regName").value.trim(),phone=$("regPhone").value.trim(),email=$("regEmail").value.trim(),type=$("regType").value;if(!name||!phone)throw Error("Enter your full name and phone number.");const c=await createUserWithEmailAndPassword(auth,email,$("regPass").value);await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name,phone,email,accountType:type,role:"customer",wholesaleStatus:type==="wholesale"?"pending":"not_applicable",active:true,createdAt:serverTimestamp()});}catch(e){msg(e.message)}};
window.resetPassword=async()=>{try{await sendPasswordResetEmail(auth,$("loginEmail").value.trim());msg("Password reset email sent.",true)}catch(e){msg(e.message)}};
window.logout=async()=>{await signOut(auth)};
function nav(){const items=[["shop","Shop"],["cart","Cart ("+cart.length+")"],["myorders","My Orders"],["knowledge","Knowledge Centre"]];if(isAdmin)items.push(["admin","Admin"],["orders","Orders"],["promotions","Promotions"],["locations","Delivery Areas"],["reports","Reports"]);$("nav").innerHTML=items.map(([k,l])=>`<button class="${activeTab===k?"active":""}" onclick="go('${k}')">${l}</button>`).join("")+`<button onclick="logout()">Sign out</button>`}
window.go=k=>{activeTab=k;nav();render()};
async function getList(c){const s=await getDocs(collection(db,c));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function loadData(){products=await getList("products");promos=(await getList("advertisements")).filter(x=>x.active!==false);articles=(await getList("knowledgeArticles")).filter(x=>x.active!==false);regions=(await getList("deliveryRegions")).filter(x=>x.active!==false);districts=(await getList("deliveryDistricts")).filter(x=>x.active!==false);towns=(await getList("deliveryTowns")).filter(x=>x.active!==false);const oq=isAdmin?query(collection(db,"confirmedOrders"),orderBy("createdAt","desc"),limit(200)):query(collection(db,"confirmedOrders"),where("customerUid","==",user.uid),orderBy("createdAt","desc"),limit(100));const s=await getDocs(oq);orders=s.docs.map(d=>({id:d.id,...d.data()}))}
function priceFor(p){return Number(p.retailPrice??p.price??0)}
function renderPromo(){const p=promos.filter(x=>{const n=Date.now();return(!x.startAt||new Date(x.startAt).getTime()<=n)&&(!x.endAt||new Date(x.endAt).getTime()>=n)}).sort((a,b)=>(b.priority||0)-(a.priority||0))[0];$("promoArea").innerHTML=p?`<div class="promo"><div class="promoText"><span class="badge new">SPECIAL OFFER</span><h2>${esc(p.title||"New from Mary Cereal Mix")}</h2><p>${esc(p.description||"Discover our products.")}</p>${p.productId?`<button class="gold" onclick="addProduct('${p.productId}')">Add to Cart</button>`:""}</div>${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="">`:""}</div>`:""}
function render(){renderPromo();const page=$("page");if(activeTab==="shop")page.innerHTML=shopHTML();else if(activeTab==="cart")page.innerHTML=cartHTML();else if(activeTab==="myorders")page.innerHTML=ordersHTML();else if(activeTab==="admin")page.innerHTML=adminHTML();else if(activeTab==="orders")page.innerHTML=adminOrdersHTML();else if(activeTab==="promotions")page.innerHTML=promosHTML();else if(activeTab==="locations")page.innerHTML=locationsHTML();else if(activeTab==="knowledge")page.innerHTML=knowledgeHTML();else if(activeTab==="reports")page.innerHTML=reportsHTML()}
function shopHTML(){return `<div class="between"><div><h1>Our Products</h1><p class="muted">Choose your favourite cereal mix.</p></div><span class="badge">${profile.accountType==="wholesale"?(profile.wholesaleStatus==="approved"?"Wholesale approved":"Wholesale approval pending"):"Retail customer"}</span></div><div class="grid">${products.filter(p=>p.active!==false).map(p=>{const pr=priceFor(p);return `<div class="card product">${p.imageUrl?`<img src="${esc(p.imageUrl)}">`:""}<div class="row">${p.isNew?'<span class="badge new">NEW</span>':""}<span class="badge">${esc(p.unit||"Pack")}</span></div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||"")}</p><div class="price">${money(pr)}</div><div class="row"><button onclick="addProduct('${p.id}')">Add to Cart</button><span class="small muted">${Number(p.stockQuantity||0)} in stock</span></div></div>`}).join("")||'<div class="empty">No products are available yet.</div>'}</div>`}
window.addProduct=id=>{const p=products.find(x=>x.id===id);if(!p)return;const item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,name:p.name,unit:p.unit||"Pack",price:priceFor(p),qty:1,imageUrl:p.imageUrl||""});toast("Added to cart");nav()};
function cartHTML(){const sub=cart.reduce((s,x)=>s+x.price*x.qty,0);return `<h1>Your Cart</h1>${cart.length?cart.map(x=>`<div class="card between"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} × ${x.qty}</div></div><div class="actions"><button class="secondary" onclick="qty('${x.id}',-1)">−</button><button class="secondary" onclick="qty('${x.id}',1)">+</button><button class="danger" onclick="removeCart('${x.id}')">Remove</button></div></div>`).join("")+`<div class="panel"><h2>Subtotal: ${money(sub)}</h2><p class="muted">Delivery fee is calculated after you select your district.</p><button onclick="checkout()">Continue to Checkout</button></div>`:'<div class="empty">Your cart is empty.</div>'}`}
window.qty=(id,n)=>{const x=cart.find(x=>x.id===id);if(x)x.qty=Math.max(1,x.qty+n);nav();render()};window.removeCart=id=>{cart=cart.filter(x=>x.id!==id);nav();render()};
window.checkout=()=>{activeTab="checkout";nav();$("page").innerHTML=checkoutHTML()};
function checkoutHTML(){return `<h1>Delivery & Payment</h1><div class="panel"><div class="grid"><div class="field"><label>Full name</label><input id="coName" value="${esc(profile.name)}"></div><div class="field"><label>Registered phone</label><input id="coPhone" value="${esc(profile.phone)}"></div><div class="field"><label>Alternate delivery phone</label><input id="coAlt"></div><div class="field"><label>Email</label><input id="coEmail" value="${esc(user.email)}"></div><div class="field"><label>Region</label><select id="coRegion" onchange="fillDistricts()"><option value="">Select region</option>${regions.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select></div><div class="field"><label>District / Municipality</label><select id="coDistrict" onchange="fillTowns()"><option value="">Select district</option></select></div><div class="field"><label>Town / Community</label><select id="coTown"><option value="">Select town</option></select></div><div class="field"><label>Area / Neighbourhood</label><input id="coArea"></div><div class="field"><label>House number</label><input id="coHouse"></div><div class="field"><label>Street</label><input id="coStreet"></div><div class="field"><label>Landmark</label><input id="coLandmark"></div><div class="field"><label>Delivery instructions / directions</label><textarea id="coInstructions"></textarea></div></div><div class="field"><label>Payment method</label><select id="coPay" onchange="paymentInfo()"><option value="momo">MTN Mobile Money</option><option value="cod">Cash on Delivery</option></select></div><div id="payInfo" class="notice">After placing your order, send payment to MTN MoMo <b>${MOMO}</b>, account name <b>${MOMO_NAME}</b>. Use your MCM order number as the payment reference. Do not enter a transaction ID here. Admin will verify payment.</div><div id="feePreview" class="notice">Select a district to calculate delivery fee.</div><button onclick="placeOrder()">Place Order</button> <button class="secondary" onclick="go('cart')">Back to Cart</button></div>`}
window.paymentInfo=()=>{$("payInfo").innerHTML=$("coPay").value==="momo"?`MTN MoMo number <b>${MOMO}</b> · Account name <b>${MOMO_NAME}</b>. Use your MCM order number as reference. Payment remains pending until admin verifies it.`:"Cash on Delivery selected. Payment remains unpaid until cash is collected and recorded by the administrator."};
window.fillDistricts=()=>{const r=$("coRegion").value;const list=districts.filter(d=>d.regionId===r);$("coDistrict").innerHTML='<option value="">Select district</option>'+list.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("");$("coTown").innerHTML='<option value="">Select town</option>';feePreview()};
window.fillTowns=()=>{const d=$("coDistrict").value;$("coTown").innerHTML='<option value="">Select town</option>'+towns.filter(t=>t.districtId===d).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");feePreview()};
async function feeFor(districtId){if(!districtId)return null;const s=await getDoc(doc(db,"deliveryFees",districtId));return s.exists()?Number(s.data().fee||0):null}
window.feePreview=async()=>{const id=$("coDistrict")?.value;if(!id)return;const f=await feeFor(id);$("feePreview").textContent=f===null?"Delivery fee has not been configured for this district. Please contact support.":"Delivery fee: "+money(f)+" · Order total: "+money(cart.reduce((s,x)=>s+x.price*x.qty,0)+f)};
async function placeOrder(){try{const region=regions.find(x=>x.id===$("coRegion").value),district=districts.find(x=>x.id===$("coDistrict").value),town=towns.find(x=>x.id===$("coTown").value);if(!region||!district||!town)throw Error("Select a region, district and town.");if(!cart.length)throw Error("Your cart is empty.");const fee=await feeFor(district.id);if(fee===null)throw Error("Delivery fee is not configured for this district.");const subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),order=await runTransaction(db,async tx=>{const counterRef=doc(db,"counters","orders"),counter=await tx.get(counterRef),next=(counter.exists()?Number(counter.data().nextNumber||1):1),orderNo="MCM"+String(next).padStart(6,"0"),ref=doc(collection(db,"confirmedOrders"));const data={orderNo,customerUid:user.uid,customerName:$("coName").value.trim(),customerEmail:$("coEmail").value.trim(),customerPhone:$("coPhone").value.trim(),alternatePhone:$("coAlt").value.trim(),accountType:profile.accountType,delivery:{regionId:region.id,region:region.name,districtId:district.id,district:district.name,townId:town.id,town:town.name,area:$("coArea").value.trim(),houseNumber:$("coHouse").value.trim(),street:$("coStreet").value.trim(),landmark:$("coLandmark").value.trim(),instructions:$("coInstructions").value.trim()},items:cart.map(x=>({productId:x.id,name:x.name,unit:x.unit,quantity:x.qty,unitPrice:x.price,lineTotal:x.price*x.qty})),subtotal,discount:0,deliveryFee:fee,total:subtotal+fee,paymentMethod:$("coPay").value,paymentStatus:"pending",paidAmount:0,balance:subtotal+fee,orderStatus:"Order Received",status:"confirmed",createdAt:serverTimestamp(),updatedAt:serverTimestamp()};tx.set(ref,data);tx.set(counterRef,{nextNumber:next+1,updatedAt:serverTimestamp()},{merge:true});return {id:ref.id,orderNo,total:data.total}});cart=[];await addDoc(collection(db,"notifications"),{type:"new_order",title:"New order received",message:order.orderNo+" · "+money(order.total),orderId:order.id,orderNo:order.orderNo,read:false,createdAt:serverTimestamp()});toast("Order placed: "+order.orderNo);await loadData();activeTab="myorders";nav();render()}catch(e){toast(e.message)}}
function ordersHTML(){return `<h1>My Orders</h1>${orders.map(o=>orderCard(o,false)).join("")||'<div class="empty">You have not placed an order yet.</div>'}`}
function orderCard(o,admin){const d=o.delivery||{};return `<div class="panel"><div class="between"><div><h2>${esc(o.orderNo||o.id)}</h2><span class="badge">${esc(o.orderStatus||o.status||"Received")}</span> <span class="badge">${esc(o.paymentStatus||"pending")}</span></div><b>${money(o.total)}</b></div><p class="muted small">${o.createdAt?.toDate?o.createdAt.toDate().toLocaleString():""}</p><div class="timeline">${["Order Received","Order Confirmed","Processing","Ready for Dispatch","Dispatched","Delivered"].map(s=>`<div class="step"><b>${s}</b>${o.orderStatus===s?' · Current status':""}</div>`).join("")}</div><h3>Delivery address</h3><p>${esc([d.houseNumber,d.street,d.area,d.town,d.district,d.region].filter(Boolean).join(", "))}</p><p class="small">Landmark: ${esc(d.landmark||"—")} · Phone: ${esc(o.alternatePhone||o.customerPhone||"")}</p><h3>Items</h3>${(o.items||[]).map(i=>`<div>${esc(i.name)} × ${i.quantity} — ${money(i.lineTotal)}</div>`).join("")}<div class="hr"></div><div>Subtotal: ${money(o.subtotal)} · Delivery: ${money(o.deliveryFee)} · Total: <b>${money(o.total)}</b></div>${admin?`<div class="field"><label>Update order status</label><select id="st_${o.id}">${["Order Received","Order Confirmed","Processing","Ready for Dispatch","Dispatched","Delivered","Cancelled","Rejected"].map(s=>`<option ${o.orderStatus===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Delivery person / dispatch note</label><input id="dp_${o.id}" value="${esc(o.deliveryPerson||"")}" placeholder="Name and phone / dispatch note"></div><div class="field"><label>Admin note</label><textarea id="an_${o.id}">${esc(o.adminNote||"")}</textarea></div><button onclick="updateOrder('${o.id}')">Save order update</button><button class="secondary" onclick="verifyPayment('${o.id}')">Mark payment received</button><button class="secondary" onclick="printOrder('${o.id}')">Print</button>`:""}</div>`}
window.updateOrder=async id=>{const o=orders.find(x=>x.id===id);await updateDoc(doc(db,"confirmedOrders",id),{orderStatus:$("st_"+id).value,deliveryPerson:$("dp_"+id).value,adminNote:$("an_"+id).value,updatedAt:serverTimestamp()});await addDoc(collection(db,"notifications"),{type:"order_update",title:"Order updated",message:(o?.orderNo||id)+" status changed",orderId:id,read:false,createdAt:serverTimestamp()});await loadData();render();toast("Order updated")};
window.verifyPayment=async id=>{const o=orders.find(x=>x.id===id);const amount=Number(prompt("Amount received (GH₵)",String(o.balance??o.total)));if(!Number.isFinite(amount)||amount<=0)return;await runTransaction(db,async tx=>{const ref=doc(db,"confirmedOrders",id),snap=await tx.get(ref);if(!snap.exists())throw Error("Order not found");const d=snap.data(),paid=Number(d.paidAmount||0)+amount,balance=Math.max(0,Number(d.total||0)-paid);tx.update(ref,{paidAmount:paid,balance,paymentStatus:balance===0?"paid":"part_paid",updatedAt:serverTimestamp()});const p=doc(collection(db,"payments"));tx.set(p,{orderId:id,orderNo:d.orderNo,customerUid:d.customerUid,customerName:d.customerName,amount,method:d.paymentMethod,verifiedBy:user.uid,createdAt:serverTimestamp()})});await loadData();render();toast("Payment recorded")};
window.printOrder=id=>{const o=orders.find(x=>x.id===id);if(!o)return;const w=window.open("","_blank");w.document.write(`<h1>MARY CEREAL MIX</h1><h2>${esc(o.orderNo||id)}</h2><pre>${esc(JSON.stringify(o,null,2))}</pre>`);w.document.close();w.print()};
function adminOrdersHTML(){return `<h1>Order Management</h1><div class="field"><label>Search MCM order number / customer</label><input id="orderSearch" oninput="filterOrders()" placeholder="MCM000001 or customer name"></div><div id="orderResults">${orders.map(o=>orderCard(o,true)).join("")||"No orders yet."}</div>`}
window.filterOrders=()=>{const v=$("orderSearch").value.toLowerCase();$("orderResults").innerHTML=orders.filter(o=>(o.orderNo||"").toLowerCase().includes(v)||(o.customerName||"").toLowerCase().includes(v)||(o.customerPhone||"").includes(v)).map(o=>orderCard(o,true)).join("")};
function adminHTML(){const users=window._adminUsers||[];const pending=users.filter(x=>x.accountType==="wholesale"&&x.wholesaleStatus==="pending");return `<h1>Administrator Dashboard</h1><div class="grid"><div class="card"><div class="muted">Orders loaded</div><div class="stat">${orders.length}</div></div><div class="card"><div class="muted">Pending payment</div><div class="stat">${orders.filter(o=>o.paymentStatus!=="paid").length}</div></div><div class="card"><div class="muted">Customer accounts</div><div class="stat">${users.length}</div></div><div class="card"><div class="muted">Products</div><div class="stat">${products.length}</div></div></div><div class="panel"><h2>Add / Update Product</h2><div class="grid"><div class="field"><label>Product name</label><input id="pName"></div><div class="field"><label>Unit / pack size</label><input id="pUnit"></div><div class="field"><label>Retail price (GH₵)</label><input id="pPrice" type="number" step=".01"></div><div class="field"><label>Stock quantity</label><input id="pStock" type="number"></div><div class="field"><label>Image URL</label><input id="pImage"></div><div class="field"><label>Description</label><input id="pDesc"></div></div><button onclick="saveProduct()">Save product</button></div><div class="panel"><h2>Products</h2>${products.map(p=>`<div class="between card"><div><b>${esc(p.name)}</b><div>${money(priceFor(p))} · Stock ${p.stockQuantity||0}</div></div><button class="danger" onclick="deactivateProduct('${p.id}')">Deactivate</button></div>`).join("")}</div><div class="panel"><h2>Wholesale approvals</h2>${pending.map(x=>`<div class="between card"><span>${esc(x.name)} · ${esc(x.phone)}</span><button onclick="approveWholesale('${x.uid}')">Approve</button></div>`).join("")||"No pending approvals."}</div><div class="panel"><h2>Live notification centre</h2><div id="notifications">${(window._notifications||[]).map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.message)}</p></div>`).join("")||"No notifications."}</div></div>`}
window.saveProduct=async()=>{const name=$("pName").value.trim(),price=Number($("pPrice").value),stock=Number($("pStock").value);if(!name||price<0||stock<0) return toast("Enter valid product details.");await addDoc(collection(db,"products"),{name,unit:$("pUnit").value,retailPrice:price,stockQuantity:stock,imageUrl:$("pImage").value,description:$("pDesc").value,active:true,isNew:true,newUntil:new Date(Date.now()+14*864e5).toISOString(),createdAt:serverTimestamp()});await loadData();render();toast("Product saved")};
window.deactivateProduct=async id=>{await updateDoc(doc(db,"products",id),{active:false});await loadData();render()};
function promosHTML(){return `<h1>Advertisements & Promotions</h1><div class="panel"><div class="grid"><div class="field"><label>Title</label><input id="adTitle"></div><div class="field"><label>Description</label><input id="adDesc"></div><div class="field"><label>Image URL</label><input id="adImage"></div><div class="field"><label>Linked product</label><select id="adProduct"><option value="">No product link</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>Priority</label><input id="adPriority" type="number" value="1"></div><div class="field"><label>Start date</label><input id="adStart" type="date"></div><div class="field"><label>End date</label><input id="adEnd" type="date"></div></div><button onclick="savePromo()">Publish promotion</button></div>${promos.map(p=>`<div class="card between"><div><b>${esc(p.title)}</b><p>${esc(p.description)}</p></div><button class="danger" onclick="deletePromo('${p.id}')">Delete</button></div>`).join("")}` }
window.savePromo=async()=>{await addDoc(collection(db,"advertisements"),{title:$("adTitle").value,description:$("adDesc").value,imageUrl:$("adImage").value,productId:$("adProduct").value,priority:Number($("adPriority").value||0),startAt:$("adStart").value,endAt:$("adEnd").value,active:true,createdAt:serverTimestamp()});await loadData();render();toast("Promotion published")};window.deletePromo=async id=>{await updateDoc(doc(db,"advertisements",id),{active:false});await loadData();render()};
function locationsHTML(){return `<h1>Delivery Area & Fee Management</h1><div class="panel"><h2>Add region</h2><div class="row"><input id="regionName" placeholder="Region name"><button onclick="addLocation('deliveryRegions','regionName')">Add region</button></div><h2>Add district</h2><div class="row"><select id="districtRegion">${regions.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select><input id="districtName" placeholder="District / Municipality"><input id="districtFee" type="number" placeholder="Delivery fee GH₵"><button onclick="addDistrict()">Add district</button></div><h2>Add town</h2><div class="row"><select id="townDistrict">${districts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select><input id="townName" placeholder="Town / Community"><button onclick="addTown()">Add town</button></div></div><div class="panel"><h2>Configured areas</h2>${regions.map(r=>`<h3>${esc(r.name)}</h3>${districts.filter(d=>d.regionId===r.id).map(d=>`<div class="pill">${esc(d.name)} · ${money(d.fee??0)}</div>`).join("")}`).join("")}</div>`}
window.addLocation=async(c,id)=>{const name=$(id).value.trim();if(name){await addDoc(collection(db,c),{name,active:true,createdAt:serverTimestamp()});await loadData();render()}};
window.addDistrict=async()=>{const name=$("districtName").value.trim(),regionId=$("districtRegion").value,fee=Number($("districtFee").value);if(!name||!regionId||fee<0)return toast("Enter district and fee.");const ref=await addDoc(collection(db,"deliveryDistricts"),{name,regionId,active:true,createdAt:serverTimestamp()});await setDoc(doc(db,"deliveryFees",ref.id),{districtId:ref.id,fee,active:true,updatedAt:serverTimestamp()});await loadData();render()};
window.addTown=async()=>{const name=$("townName").value.trim(),districtId=$("townDistrict").value;if(name&&districtId){await addDoc(collection(db,"deliveryTowns"),{name,districtId,active:true,createdAt:serverTimestamp()});await loadData();render()}};
function knowledgeHTML(){return `<h1>Knowledge Centre</h1>${articles.map(a=>`<article class="panel"><h2>${esc(a.title)}</h2><p>${esc(a.body)}</p></article>`).join("")||'<div class="empty">Helpful cereal preparation and product information will appear here.</div>'}${isAdmin?`<div class="panel"><h2>Publish an article</h2><input id="kTitle" placeholder="Article title"><textarea id="kBody" placeholder="Article content"></textarea><button onclick="saveArticle()">Publish</button></div>`:""}`}
window.saveArticle=async()=>{await addDoc(collection(db,"knowledgeArticles"),{title:$("kTitle").value,body:$("kBody").value,active:true,createdAt:serverTimestamp()});await loadData();render()};
function reportsHTML(){const total=orders.reduce((s,o)=>s+Number(o.total||0),0),paid=orders.reduce((s,o)=>s+Number(o.paidAmount||0),0);return `<h1>Sales & Delivery Reports</h1><div class="grid"><div class="card">Order value<div class="stat">${money(total)}</div></div><div class="card">Payments received<div class="stat">${money(paid)}</div></div><div class="card">Outstanding balance<div class="stat">${money(Math.max(0,total-paid))}</div></div><div class="card">Delivery fees<div class="stat">${money(orders.reduce((s,o)=>s+Number(o.deliveryFee||0),0))}</div></div></div><button onclick="window.print()">Print report</button><div class="tablewrap panel"><table><tr><th>Order</th><th>Customer</th><th>Date</th><th>Method</th><th>Status</th><th>Total</th><th>Paid</th><th>Balance</th></tr>${orders.map(o=>`<tr><td>${esc(o.orderNo||o.id)}</td><td>${esc(o.customerName)}</td><td>${o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString():""}</td><td>${esc(o.paymentMethod)}</td><td>${esc(o.orderStatus)}</td><td>${money(o.total)}</td><td>${money(o.paidAmount)}</td><td>${money(o.balance)}</td></tr>`).join("")}</table></div>`}
onAuthStateChanged(auth,async u=>{user=u;if(!u){$("authView").classList.remove("hidden");$("appView").classList.add("hidden");return}try{const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw Error("Your account profile is missing. Ask the administrator to create your profile.");profile=s.data();isAdmin=u.uid===ADMIN_UID;$("authView").classList.add("hidden");$("appView").classList.remove("hidden");await loadData();nav();render();if(isAdmin){const users=await getList("users");window._adminUsers=users;onSnapshot(query(collection(db,"notifications"),orderBy("createdAt","desc"),limit(30)),snap=>{window._notifications=snap.docs.map(d=>({id:d.id,...d.data()}));const el=$("notifications");if(el)el.innerHTML=window._notifications.map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><span class="small muted">${n.read?"Read":"Unread"}</span></div>`).join("")||"No notifications.";});}}catch(e){console.error("Mary Cereal Mix startup error:",e);$("authView").classList.remove("hidden");$("appView").classList.add("hidden");msg(e.message)}});
window.approveWholesale=async uid=>{await updateDoc(doc(db,"users",uid),{wholesaleStatus:"approved"});toast("Wholesale customer approved");location.reload()};
</script>
</body></html>
